<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge-The-Beat Multiplayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --night: #2f2466;
            --night-deep: #231a52;
            --panel: #d9ccff;
            --panel-ink: #2a1d5c;
            --pink: #ff5fa8;
            --pink-dark: #a31d6b;
            --orange: #ff9f43;
            --gold: #ffd86b;
            --mint: #5be37d;
            --outline: #1a1240;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 28px 18px 210px;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 10%, #3d2f80 0%, var(--night) 45%, var(--night-deep) 100%);
            color: #f1eaff;
            font-family: 'VT323', ui-monospace, monospace;
            font-size: 1.35rem;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }
        .container { max-width: 500px; margin: 0 auto; position: relative; z-index: 2; }

        #scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .sp { position: absolute; line-height: 0; }
        .sp svg { display: block; }
        .moon  { top: 5%; right: 8%; }
        .cloud { left: -260px; animation: drift linear infinite; }
        .cloud svg { width: var(--cw, 120px); height: auto; }
        .cloud-a { top: 16%; --cw: 130px; animation-duration: 90s; }
        .cloud-b { top: 52%; --cw: 110px; animation-duration: 120s; animation-delay: -50s; opacity: .9; }
        .cloud-c { top: 7%;  --cw: 84px;  animation-duration: 70s;  animation-delay: -22s; opacity: .85; }
        .cloud-d { top: 36%; --cw: 150px; animation-duration: 110s; animation-delay: -70s; }
        .cloud-e { top: 66%; --cw: 96px;  animation-duration: 100s; animation-delay: -35s; opacity: .8; }
        .cloud-f { top: 26%; --cw: 72px;  animation-duration: 60s;  animation-delay: -10s; opacity: .75; }
        .tree  { bottom: 64px; left: 3%; }
        .bush  { bottom: 64px; right: 4%; }
        .star  { animation: twinkle 3s steps(2) infinite; }
        @keyframes drift { to { transform: translateX(calc(100vw + 300px)); } }
        @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
        #ground {
            position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 1;
            border-top: 6px solid #c3cbef;
            background-size: 64px 32px;
            image-rendering: pixelated;
            pointer-events: none;
        }
        @media (max-width: 700px) { .tree, .bush { display: none; } }

        .hero {
            position: relative;
            background: var(--panel);
            color: var(--panel-ink);
            border-radius: 28px;
            padding: 30px 18px 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0, 0, 0, .25);
        }
        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1rem, 5.2vw, 1.55rem);
            line-height: 1.6;
            margin: 0 0 22px;
            color: var(--panel-ink);
            letter-spacing: 1px;
        }
        .pill {
            display: inline-block;
            position: relative;
            background: var(--pink);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: .6rem;
            padding: 10px 26px;
            border: 3px solid #4b1442;
            border-radius: 12px;
            box-shadow: inset 0 3px 0 #ff9fd0, inset 0 -4px 0 var(--pink-dark);
        }

        .card {
            background: var(--panel);
            color: var(--panel-ink);
            border-radius: 24px;
            padding: 22px 20px;
            margin-bottom: 28px;
            box-shadow: 0 8px 0 rgba(0, 0, 0, .25);
        }
        h2, h3 { font-family: 'Press Start 2P', monospace; font-weight: 400; line-height: 1.6; margin: 0 0 14px; }
        h3 { font-size: .75rem; }
        #musicPanel { display: none; }
        #charTitle { font-size: .8rem; background: var(--panel-ink); color: var(--gold); display: inline-block; padding: 10px 14px; border-radius: 10px; }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #efe8ff;
            border: 3px dashed #6b58c9;
            border-radius: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--panel-ink);
            cursor: pointer;
        }

        input[type="text"] {
            padding: 10px;
            width: 70%;
            border-radius: 8px;
            border: 2px solid var(--panel-ink);
            background: #efe8ff;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--panel-ink);
        }

        button {
            background: var(--pink);
            color: #fff;
            border: 3px solid #4b1442;
            padding: 12px 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: .62rem;
            line-height: 1.6;
            border-radius: 12px;
            cursor: pointer;
            margin: 6px;
            box-shadow: inset 0 3px 0 #ff9fd0, inset 0 -5px 0 var(--pink-dark);
            transition: transform .08s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }

        #musicButtons button { display: block; width: 100%; margin: 12px 0; text-align: left; color: var(--outline); }
        #statusText { margin: 14px 0 0; min-height: 1.4em; }

        #gameCanvas {
            display: none;
            background: var(--night-deep);
            border: 6px solid #c3cbef;
            outline: 4px solid var(--outline);
            border-radius: 6px;
            box-shadow: 0 10px 0 rgba(0, 0, 0, .35);
            margin: 15px auto 22px;
            width: min(100%, max(240px, min(400px, calc((100vh - 150px) * .727))));
            height: auto;
            aspect-ratio: 400 / 550;
            touch-action: none;
        }

        .share-box {
            background: #2a1d5c;
            color: #ffd86b;
            padding: 10px;
            border-radius: 10px;
            word-break: break-all;
            margin: 10px 0;
            font-size: 0.9rem;
        }
    </style>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="scene">
    <div class="sp moon" data-sprite="moon" data-px="6"></div>
</div>
<div id="ground"></div>

<div class="container">
    <div class="hero">
        <h1>DODGE-THE-BEAT</h1>
        <div class="pill">2-PLAYER MULTIPLAYER RUNNER</div>
    </div>

    <!-- SHARE LINK BANNER -->
    <div id="shareBanner" class="card">
        <h3>🔗 Share This Link With Opponent:</h3>
        <div id="shareUrlBox" class="share-box">Generating room link...</div>
        <p id="roomPlayerCount">Players in room: 1 / 2</p>
    </div>

    <!-- STEP 1: UPLOAD -->
    <div id="uploadPanel" class="card">
        <h3>1. Upload Your Photo</h3>
        <input type="file" id="imageInput" accept="image/*" />
        <br><br>
        <button onclick="uploadAndAnalyze()">Analyze & Join Room</button>
        <p id="statusText"></p>
    </div>

    <!-- STEP 2: MUSIC SELECT -->
    <div id="musicPanel" class="card">
        <h2 id="charTitle"></h2>
        <h3>🎵 Recommended Tracks:</h3>
        <div id="musicButtons"></div>

        <hr style="border-color: #6b58c9; margin: 20px 0;">

        <h3>🔍 Search Spotify:</h3>
        <input type="text" id="spotifyQuery" placeholder="Song title..." />
        <button onclick="searchSpotifyTrack()">Search</button>

        <div id="spotifyEmbedContainer" style="margin-top: 15px; display: none;">
            <iframe id="spotifyPlayer" class="spotify-frame" src="" width="100%" height="80" frameborder="0" allow="autoplay; encrypted-media"></iframe>
            <br>
            <button id="startBtn" onclick="requestStartGame()" style="background: var(--mint); color: var(--outline);">Start Game for Both!</button>
        </div>
    </div>

    <!-- STEP 3: GAME CANVAS -->
    <canvas id="gameCanvas" width="400" height="550"></canvas>

    <div id="gameOverPanel" class="card" style="display:none;">
        <h2>GAME OVER</h2>
        <p id="roastText"></p>
        <button onclick="resetGame()">Play Again</button>
    </div>
</div>

<script>
    // Socket.io Setup
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');

    if (!roomId) {
        roomId = Math.random().toString(36).substring(2, 9);
        window.history.replaceState({}, '', `?room=${roomId}`);
    }

    const roomLink = `${window.location.origin}/?room=${roomId}`;
    document.getElementById('shareUrlBox').innerText = roomLink;

    let base64Image = "";
    let gameData = null;
    let playerImg = new Image();
    let opponentImg = new Image();
    let selectedBpm = 7;
    let opponentLane = 2;
    let opponentScore = 0;
    let opponentDead = false;

    // Room Syncing
    socket.on('roomState', (room) => {
        const count = Object.keys(room.players).length;
        document.getElementById('roomPlayerCount').innerText = `Players in room: ${count} / 2`;

        // Fetch Opponent Image if connected
        for (let pid in room.players) {
            if (pid !== socket.id && room.players[pid].image) {
                opponentImg.src = room.players[pid].image;
            }
        }
    });

    socket.on('trackSelected', ({ trackId, speed }) => {
        selectedBpm = speed;
        loadSpotifyPlayer(trackId);
    });

    socket.on('gameStart', ({ speed }) => {
        startGame(speed);
    });

    socket.on('opponentMoved', ({ lane }) => {
        opponentLane = lane;
    });

    socket.on('opponentScore', ({ score }) => {
        opponentScore = score;
    });

    socket.on('opponentDied', ({ score, roast }) => {
        opponentDead = true;
    });

    // Upload & Vision AI
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            base64Image = reader.result;
            playerImg.src = base64Image;
        };
        reader.readAsDataURL(file);
    });

    async function uploadAndAnalyze() {
        if (!base64Image) return alert("Please select an image first!");
        document.getElementById('statusText').innerText = "Gemma 4 reading photo vibe...";

        try {
            const res = await fetch('/api/analyze-character', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageBase64: base64Image })
            });
            const data = await res.json();
            if (!data.success) return alert("Error processing image.");

            gameData = data.gameData;
            document.getElementById('uploadPanel').style.display = 'none';
            document.getElementById('musicPanel').style.display = 'block';

            document.getElementById('charTitle').innerText = `Character: ${gameData.characterName}`;

            // Join Room via WebSockets
            socket.emit('joinRoom', { roomId, playerImage: base64Image, characterName: gameData.characterName });

            const btnContainer = document.getElementById('musicButtons');
            btnContainer.innerHTML = '';
            gameData.musicOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = `🎵 ${opt.genre}: ${opt.description}`;
                btn.onclick = () => {
                    selectedBpm = opt.bpmSpeed;
                    socket.emit('selectTrack', { roomId, trackId: opt.spotifyTrackId, speed: opt.bpmSpeed });
                };
                btnContainer.appendChild(btn);
            });
        } catch (err) {
            alert("Error connecting.");
        } finally {
            document.getElementById('statusText').innerText = "";
        }
    }

    function loadSpotifyPlayer(trackId) {
        const iframe = document.getElementById('spotifyPlayer');
        iframe.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0&autoplay=1`;
        document.getElementById('spotifyEmbedContainer').style.display = 'block';
    }

    async function searchSpotifyTrack() {
        const q = document.getElementById('spotifyQuery').value.trim();
        if (!q) return;
        const res = await fetch(`/api/spotify/search?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data.success && data.spotifyTrackId) {
            socket.emit('selectTrack', { roomId, trackId: data.spotifyTrackId, speed: 7 });
        }
    }

    function requestStartGame() {
        socket.emit('startGame', { roomId });
    }

    // Game Canvas Loop
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const numLanes = 4;
    const laneWidth = canvas.width / numLanes;
    let currentLane = 1;
    let obstacleSpeed = 6;
    let score = 0;
    let gameOver = false;
    let fallingObjects = [];
    let gameInterval = null;

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') if (currentLane > 0) currentLane--;
        if (e.key === 'ArrowRight' || e.key === 'd') if (currentLane < numLanes - 1) currentLane++;
        socket.emit('moveLane', { roomId, lane: currentLane });
    });

    function startGame(speed) {
        obstacleSpeed = speed;
        document.getElementById('musicPanel').style.display = 'none';
        canvas.style.display = 'block';
        score = 0;
        gameOver = false;
        fallingObjects = [];

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(spawnObstacle, 700);
        requestAnimationFrame(gameLoop);
    }

    function spawnObstacle() {
        if (gameOver) return;
        const lane = Math.floor(Math.random() * numLanes);
        const label = gameData.obstacles[Math.floor(Math.random() * gameData.obstacles.length)];
        fallingObjects.push({ lane, y: -40, label });
    }

    function gameLoop() {
        if (gameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Lanes
        for (let i = 0; i < numLanes; i++) {
            ctx.fillStyle = i % 2 === 0 ? '#2b2060' : '#352879';
            ctx.fillRect(i * laneWidth, 0, laneWidth, canvas.height);
        }

        // Player Avatar
        const playerX = currentLane * laneWidth + laneWidth / 2;
        const playerY = canvas.height - 70;
        ctx.drawImage(playerImg, playerX - 20, playerY - 20, 40, 40);

        // Opponent Avatar (Ghosted)
        if (opponentImg.src) {
            const oppX = opponentLane * laneWidth + laneWidth / 2;
            ctx.globalAlpha = 0.5;
            ctx.drawImage(opponentImg, oppX - 20, playerY - 20, 40, 40);
            ctx.globalAlpha = 1.0;
        }

        // Falling Obstacles
        for (let i = 0; i < fallingObjects.length; i++) {
            let obj = fallingObjects[i];
            obj.y += obstacleSpeed;
            ctx.fillStyle = '#ff5fa8';
            ctx.fillRect(obj.lane * laneWidth + 6, obj.y - 15, laneWidth - 12, 30);

            if (obj.lane === currentLane && obj.y > playerY - 35 && obj.y < playerY + 25) {
                gameOver = true;
                socket.emit('playerDied', { roomId, score, roast: gameData.roast });
                document.getElementById('gameOverPanel').style.display = 'block';
                document.getElementById('roastText').innerText = `You hit ${obj.label}! Opponent Score: ${opponentScore}`;
                return;
            }
        }

        fallingObjects = fallingObjects.filter(obj => obj.y < canvas.height + 50);

        score++;
        socket.emit('updateScore', { roomId, score });

        // HUD Scores
        ctx.fillStyle = '#ffd86b';
        ctx.font = '12px "Press Start 2P", monospace';
        ctx.fillText(`YOU: ${score}`, 15, 30);
        ctx.fillText(`OPP: ${opponentScore}`, 250, 30);

        requestAnimationFrame(gameLoop);
    }

    function resetGame() {
        location.reload();
    }
</script>
</body>
</html>
